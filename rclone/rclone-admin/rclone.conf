# Rclone Admin Web GUI — 预配置 Remote
#
# 本配置文件供 rclone-admin 容器使用，提供对本地磁盘存储的管理视图。
# 更多 remote 可在 Web GUI 中交互式添加，或在此文件中追加。

# ---- 全量本地存储（rclone serve s3 的根目录）----
# 浏览路径: all-storage:/
# 实际路径: ./local-storage/ (宿主机)
[all-storage]
type = alias
remote = /data

# ---- 头像存储（user-avatar bucket 对应的子目录）----
# 浏览路径: avatar-files:/
# 实际路径: ./local-storage/user-avatar/ (宿主机)
[avatar-files]
type = alias
remote = /data/user-avatar
